name: Tests

on:
  push:
  pull_request:

# Least privilege: the tests only need to read the repository.
permissions:
  contents: read

jobs:
  pytest:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      # Firmware guard: the pushed tree must not contain firmware or private references (docs/FIRMWARE_PROTECTION.md).
      - run: python -I src/ecu_studio/tools/firmware_guard.py tree HEAD
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]" pytest-github-actions-annotate-failures
      # Failures appear as annotations on the run (readable without the full log).
      - run: python -m pytest -q -rf
