name: Release

# Pushing a tag like v1.15.0 builds, tests and publishes the Windows package.
# The tag must equal ecu_studio.__version__ and CHANGELOG.md needs a "## 1.15.0" section.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  windows-release:
    runs-on: windows-latest
    permissions:
      contents: write        # create the GitHub release
      id-token: write        # build provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        id: py
        with:
          python-version: '3.13'
          architecture: x64
      - name: Check tag and release notes
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-deps -e .
          python -m ecu_studio.tools.release_notes "${{ github.ref_name }}" --out release-notes.md
      - name: Build, test and package (portable ZIP, EXE smoke test, run without Python in PATH)
        shell: pwsh
        run: ./build_release.ps1 -Python313 "${{ steps.py.outputs.python-path }}"
      - name: Windows installer (Inno Setup 6)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          $version = "${{ github.ref_name }}".TrimStart('v')
          & $iscc /Qp "/DAppVersion=$version" packaging\installer.iss
          if ($LASTEXITCODE -ne 0) { throw 'Installer-Build fehlgeschlagen' }
          (Get-FileHash "dist\ECU-Studio-AI-$version-setup.exe" -Algorithm SHA256).Hash.ToLower() + "  ECU-Studio-AI-$version-setup.exe" |
            Set-Content -Encoding ascii "dist\ECU-Studio-AI-$version-setup.exe.sha256"
      - name: Build provenance (verifiable with "gh attestation verify")
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/ECU-Studio-AI-*-windows-x64.zip
            dist/ECU-Studio-AI-*-setup.exe
      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          gh release create "${{ github.ref_name }}" --verify-tag --title "ECU Studio AI $version" --notes-file release-notes.md `
            "dist/ECU-Studio-AI-$version-windows-x64.zip" "dist/ECU-Studio-AI-$version-windows-x64.zip.sha256" `
            "dist/ECU-Studio-AI-$version-setup.exe" "dist/ECU-Studio-AI-$version-setup.exe.sha256"
