name: Release

# Pushing a tag like v1.16.0 builds, tests and publishes the Windows package.
# The tag must equal ecu_studio.__version__ (and pyproject.toml); CHANGELOG.md needs a "## 1.16.0" section and
# docs/RELEASE_NOTES_1.16.0.md a complete German and English part (tools/release_notes.py).
# Publishing only happens after the real update path passed on several Windows versions.
#
# Release candidates (from 1.21.0): a tag v1.21.0-rc1 (core/app_version.py: vX.Y.Z-rcN, nothing else) is published
# ONLY as a GitHub pre-release, never as "Latest" (tools/release_guard.py plans the flags before anything is created,
# checks the draft, publishes, and checks again that "Latest" and all other releases are unchanged). The program's
# stable update channel never offers a candidate; only the test channel the user switched on does.
#
# Dry run: pushing a branch release-dry-run/** runs everything for the version in the source EXCEPT publishing
# (no tag, no release, no attestation): the job publish-plan prints, with read-only rights, exactly how the tag
# would be published (pre-release flags, title, files with SHA-256). That proves changes to this workflow first.
on:
  push:
    tags: ['v*.*.*']
    branches: ['release-dry-run/**']

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      channel: ${{ steps.tag.outputs.channel }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        id: py
        with:
          python-version: '3.13'
          architecture: x64
      # Firmware guard: the released tree must not contain firmware or private references (docs/FIRMWARE_PROTECTION.md).
      - name: Firmware guard
        shell: pwsh
        run: |
          python -I src/ecu_studio/tools/firmware_guard.py tree HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Firmware-Schutz: verbotene Dateien im Release-Stand.' }
      - name: Release tag
        id: tag
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-deps -e .
          if ("${{ github.ref_type }}" -eq 'tag') { $tag = "${{ github.ref_name }}" }
          else { $tag = 'v' + (python -c "import ecu_studio; print(ecu_studio.__version__)").Trim() }
          # Only v1.2.3 or v1.2.3-rcN; the channel and the Windows file version follow from it (core/app_version.py).
          $channel = (python -m ecu_studio.core.app_version $tag channel)
          if ($LASTEXITCODE -ne 0) { throw "Tag $tag ist keine Version der Form v1.2.3 oder v1.2.3-rcN." }
          $version = (python -m ecu_studio.core.app_version $tag text).Trim()
          $fileVersion = (python -m ecu_studio.core.app_version $tag windows).Trim()
          $pep440 = (python -m ecu_studio.core.app_version $tag pep440).Trim()
          $installed = (python -c "import importlib.metadata as m; print(m.version('ecu-studio-ai'))").Trim()
          if ($installed -ne $pep440) { throw "Paket-Metadaten $installed statt $pep440 (pyproject.toml)" }
          "tag=$tag" | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT
          "channel=$($channel.Trim())" | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT
          "file_version=$fileVersion" | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT
          "Release-Tag: $tag (${{ github.ref_type }}), Kanal $($channel.Trim()), Version $version, Windows $fileVersion, PEP 440 $pep440"
      - name: Release guard negative test (wrong versions, missing pre-release flag, RC as Latest are refused)
        shell: pwsh
        run: |
          python -m ecu_studio.tools.release_guard selftest
          if ($LASTEXITCODE -ne 0) { throw 'Release-Wächter lehnt nicht alle Negativfälle ab.' }
      - name: Check tag, title and bilingual release notes
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist -Force | Out-Null
          python -m ecu_studio.tools.release_notes "${{ steps.tag.outputs.tag }}" --out dist/release-notes.md --title-out dist/release-title.txt --channel-out dist/release-channel.txt
          if ($LASTEXITCODE -ne 0) { throw 'Version, Titel oder Release Notes (Deutsch/Englisch) stimmen nicht.' }
          if ((Get-Content dist/release-channel.txt).Trim() -ne '${{ steps.tag.outputs.channel }}') { throw 'Kanal der Release Notes passt nicht zum Tag.' }
      - name: Build, test and package (portable ZIP, EXE smoke test, run without Python in PATH)
        shell: pwsh
        run: ./build_release.ps1 -Python313 "${{ steps.py.outputs.python-path }}"
      - name: Windows installer (Inno Setup 6)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          $version = "${{ steps.tag.outputs.tag }}".TrimStart('v')
          & $iscc /Qp "/DAppVersion=$version" "/DAppFileVersion=${{ steps.tag.outputs.file_version }}" packaging\installer.iss
          if ($LASTEXITCODE -ne 0) { throw 'Installer-Build fehlgeschlagen' }
          # Every file in the installer by SHA-256: no withdrawn learned data (docs/MODELLKARTE.md § 2e).
          python -m ecu_studio.tools.withdrawn "dist\ECU-Studio-AI-$version-setup-manifest.txt"
          if ($LASTEXITCODE -ne 0) { throw 'Installer enthält zurückgezogene Lerndaten.' }
          (Get-FileHash "dist\ECU-Studio-AI-$version-setup.exe" -Algorithm SHA256).Hash.ToLower() + "  ECU-Studio-AI-$version-setup.exe" |
            Set-Content -Encoding ascii "dist\ECU-Studio-AI-$version-setup.exe.sha256"
      - name: Version of every built file equals the tag
        shell: pwsh
        run: |
          $tag = "${{ steps.tag.outputs.tag }}"; $version = $tag.TrimStart('v'); $fileVersion = '${{ steps.tag.outputs.file_version }}'
          python -m ecu_studio.tools.release_notes $tag --out dist/release-notes.md --title-out dist/release-title.txt --channel-out dist/release-channel.txt --package dist/ECU-Studio-AI
          if ($LASTEXITCODE -ne 0) { throw 'Programmordner hat eine andere Version als der Tag.' }
          # Windows version resources of setup.exe and of the starter EXE (Properties > Details): text = version,
          # numbers = x.y.z.0 (stable) or x.y.z.N (rcN). Inno pads the text with blanks/NULs; compare it trimmed.
          foreach ($file in @("dist\ECU-Studio-AI-$version-setup.exe", 'dist\ECU-Studio-AI\ECU-Studio-AI.exe')) {
            $info = (Get-Item $file).VersionInfo
            $productVersion = $info.ProductVersion -replace '[\s\x00]+$', ''
            $numeric = "$($info.FileMajorPart).$($info.FileMinorPart).$($info.FileBuildPart).$($info.FilePrivatePart)"
            if ($productVersion -ne $version) { throw "$file`: Produktversion '$productVersion' statt $version" }
            if ($numeric -ne $fileVersion) { throw "$file`: Dateiversion $numeric statt $fileVersion" }
          }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path "dist\ECU-Studio-AI-$version-windows-x64.zip").Path)
          try {
            $entry = $zip.GetEntry('ECU-Studio-AI/VERSION.txt')
            $reader = New-Object System.IO.StreamReader($entry.Open())
            $inZip = $reader.ReadToEnd().Trim(); $reader.Dispose()
          } finally { $zip.Dispose() }
          if ($inZip -ne $version) { throw "ZIP enthält Version $inZip statt $version" }
          "Version ${version}: Programmordner, ZIP, Installer; Titel '$(Get-Content dist/release-title.txt)'"
      - name: Sign packages (Ed25519, if a signing key is configured)
        shell: pwsh
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          # Fails if the app ships a public key but the secret is missing or does not match.
          $version = "${{ steps.tag.outputs.tag }}".TrimStart('v')
          python -m ecu_studio.tools.sign_release sign "dist/ECU-Studio-AI-$version-windows-x64.zip" "dist/ECU-Studio-AI-$version-setup.exe"
          if ($LASTEXITCODE -ne 0) { throw 'Signatur fehlgeschlagen' }
      - uses: actions/upload-artifact@v4
        with:
          name: package
          path: |
            dist/ECU-Studio-AI-*-windows-x64.zip
            dist/ECU-Studio-AI-*-windows-x64.zip.sha256
            dist/ECU-Studio-AI-*-setup.exe
            dist/ECU-Studio-AI-*-setup.exe.sha256
            dist/ECU-Studio-AI-*.sig
            dist/release-notes.md
            dist/release-title.txt
            dist/release-channel.txt
          retention-days: 7

  update-test:
    # Exercise the updater and the resulting installation on clean Windows runners.
    # The legacy application's GUI hand-off is not reproduced here: the script is
    # started directly from an external work directory, as documented below.
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen     # runners have no interactive desktop
      TAG: ${{ needs.build.outputs.tag }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: package
          path: new
      - name: Update from the last published release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          ECU_UPDATER_QUIET: '1'
        run: |
          $ErrorActionPreference = 'Stop'
          $version = $env:TAG.TrimStart('v')
          $zip = (Resolve-Path "new\ECU-Studio-AI-$version-windows-x64.zip").Path
          $sha = ((Get-Content "$zip.sha256") -split '\s+')[0]
          if ((Get-FileHash $zip -Algorithm SHA256).Hash.ToLower() -ne $sha) { throw 'Prüfsumme des neuen Pakets stimmt nicht' }
          $work = Join-Path $env:RUNNER_TEMP 'update'
          New-Item -ItemType Directory $work | Out-Null
          $old = gh release list --repo "${{ github.repository }}" --exclude-drafts --exclude-pre-releases --json tagName --jq '.[].tagName' |
                 Where-Object { $_ -ne $env:TAG } | Select-Object -First 1
          if (-not $old) {
            Write-Host '::notice::Kein früheres Release – nur Neuinstallation geprüft.'
            Expand-Archive $zip $work
          } else {
            if ($old -eq 'v1.16.2') {
              Write-Host '::warning::Der 1.16.2-Updater wurde aus der laufenden Anwendung mit deren Installationsordner als cwd gestartet. 1.16.2 -> 1.16.3 muss einmal manuell installiert werden; dieser Job prüft den externen Arbeitsordner des reparierten Updaters.'
            }
            gh release download $old --repo "${{ github.repository }}" --pattern '*-windows-x64.zip' --dir $work
            Expand-Archive (Get-ChildItem "$work\*-windows-x64.zip").FullName $work
            $install = Join-Path $work 'ECU-Studio-AI'
            "Installiert: $old -> Update auf $version"
            Copy-Item "$install\_internal\updater.ps1" "$work\updater.ps1"
            powershell -NoProfile -ExecutionPolicy Bypass -File "$work\updater.ps1" -InstallDir $install -Archive $zip -Sha256 $sha -LogFile "$work\update.log"
            Get-Content "$work\update.log"
            if ($LASTEXITCODE -ne 0) { throw "Updater-Exit $LASTEXITCODE" }
          }
          $install = Join-Path $work 'ECU-Studio-AI'
          if ((Get-Content "$install\VERSION.txt").Trim() -ne $version) { throw 'Nach dem Update falsche Version' }
          $smoke = Join-Path $work 'smoke'
          $p = Start-Process "$install\ECU-Studio-AI.exe" -ArgumentList @('--smoke-test', ('"' + $smoke + '"')) -PassThru -Wait
          if ($p.ExitCode -ne 0 -or -not (Get-Content "$smoke\gui-smoke.json" -Raw | ConvertFrom-Json).passed) { throw 'Oberflächentest nach dem Update fehlgeschlagen' }
          if ($old) {
            Copy-Item "$install\_internal\updater.ps1" "$work\updater-new.ps1" -Force
            powershell -NoProfile -ExecutionPolicy Bypass -File "$work\updater-new.ps1" -InstallDir $install -Restore -LogFile "$work\update.log"
            if ($LASTEXITCODE -ne 0) { throw "Wiederherstellen: Exit $LASTEXITCODE" }
            if ((Get-Content "$install\VERSION.txt").Trim() -eq $version) { throw 'Wiederherstellen hat die Version nicht gewechselt' }
            powershell -NoProfile -ExecutionPolicy Bypass -File "$work\updater-new.ps1" -InstallDir $install -Restore -LogFile "$work\update.log"
            if ($LASTEXITCODE -ne 0 -or (Get-Content "$install\VERSION.txt").Trim() -ne $version) { throw 'Zurück zur neuen Version fehlgeschlagen' }
          }
          "Update-Test auf ${{ matrix.os }} bestanden."
      - name: Installer over the last release, Apps & Features, uninstall keeps only user files
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = $env:TAG.TrimStart('v')
          $dir = Join-Path $env:LOCALAPPDATA 'Programs\ECU-Studio-AI'
          $key = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\{F8CD5330-FC90-4891-BFDA-58E6668C93A5}_is1'
          function Install([string]$Setup) {
            $p = Start-Process $Setup -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART') -PassThru -Wait
            if ($p.ExitCode -ne 0) { throw "Installer-Exit $($p.ExitCode): $Setup" }
          }
          $old = gh release list --repo "${{ github.repository }}" --exclude-drafts --exclude-pre-releases --json tagName --jq '.[].tagName' |
                 Where-Object { $_ -ne $env:TAG } | Select-Object -First 1
          if ($old) {
            $oldDir = Join-Path $env:RUNNER_TEMP 'old-setup'
            gh release download $old --repo "${{ github.repository }}" --pattern '*-setup.exe' --pattern '*-setup.exe.sha256' --dir $oldDir
            $oldSetup = (Get-ChildItem "$oldDir\*-setup.exe").FullName
            if ((Get-FileHash $oldSetup -Algorithm SHA256).Hash.ToLower() -ne ((Get-Content "$oldSetup.sha256") -split '\s+')[0]) { throw "Prüfsumme $old stimmt nicht" }
            Install $oldSetup
            "Installiert: $old"
          }
          # An unknown file of the user in the program folder must survive update and uninstallation.
          New-Item -ItemType Directory "$dir\_internal" -Force | Out-Null
          'Benutzerdatei' | Set-Content -Encoding utf8 "$dir\_internal\release-test-user-file.txt"
          Install (Resolve-Path "new\ECU-Studio-AI-$version-setup.exe").Path
          if ((Get-Content "$dir\VERSION.txt").Trim() -ne $version) { throw 'Nach der Installation falsche Version' }
          $entry = Get-ItemProperty $key
          if ($entry.DisplayVersion -ne $version -or $entry.DisplayName -ne "ECU Studio AI $version") { throw "Apps & Features: $($entry.DisplayName) / $($entry.DisplayVersion)" }
          $c = Start-Process "$dir\ECU-Studio-AI.exe" -ArgumentList '--self-check' -PassThru -Wait
          if ($c.ExitCode -ne 0) { throw 'Selbsttest der installierten EXE fehlgeschlagen' }
          # Regression (1.20.1): the uninstaller renames <app>.backup out of reach of the blanket rules of 1.20.0 and
          # older that remain in unins000.dat. If that rename FAILS, it must stop before removing anything.
          # Forced here with a file held open in the backup (the probe proves the rename really is impossible).
          $tree = { param($root) Get-ChildItem $root -Recurse -File -Force | ForEach-Object {
                    $_.FullName.Substring($root.Length) + '=' + (Get-FileHash $_.FullName).Hash } | Sort-Object }
          $own = "$dir.backup\_internal\release-test-backup-file.txt"
          New-Item -ItemType Directory (Split-Path $own) -Force | Out-Null
          'nur in der Sicherung' | Set-Content -Encoding utf8 $own
          $ownHash = (Get-FileHash $own).Hash
          $before = & $tree $dir
          $blockedLog = Join-Path $env:RUNNER_TEMP 'uninstall-blocked.log'
          $lock = [System.IO.File]::Open($own, 'Open', 'Read', 'Read')
          try {
            $renamed = $true
            try { [System.IO.Directory]::Move("$dir.backup", "$dir.backup-probe") } catch { $renamed = $false }
            if ($renamed) { [System.IO.Directory]::Move("$dir.backup-probe", "$dir.backup"); throw 'Vorbedingung: Umbenennen der Sicherung ließ sich nicht verhindern' }
            $b = Start-Process "$dir\unins000.exe" -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/LOG=`"$blockedLog`"") -PassThru
            if (-not $b.WaitForExit(300000)) { throw 'Blockierte Deinstallation endet nicht' }
            for ($i = 0; $i -lt 240 -and (Get-Process -Name '_iu*' -ErrorAction SilentlyContinue); $i++) { Start-Sleep -Milliseconds 500 }
            Start-Sleep -Seconds 2
          } finally { $lock.Dispose() }
          Get-Content $blockedLog -ErrorAction SilentlyContinue | Select-String 'umbenannt|ABGEBROCHEN'
          if ($b.ExitCode -eq 0) { throw 'Blockierte Deinstallation meldet Erfolg (Exit 0)' }
          if (-not (Select-String -Path $blockedLog -Pattern 'DEINSTALLATION ABGEBROCHEN' -SimpleMatch -Quiet)) { throw 'Abbruch nicht im Deinstallationsprotokoll' }
          if (Compare-Object $before (& $tree $dir)) { throw 'Blockierte Deinstallation hat den Programmordner verändert' }
          if (-not (Get-ItemProperty $key -ErrorAction SilentlyContinue)) { throw 'Blockierte Deinstallation hat den Eintrag in Apps & Features entfernt' }
          if ((Get-FileHash $own).Hash -ne $ownHash -or (Test-Path "$dir.backup.erhalten*")) { throw 'Sicherung bei blockierter Deinstallation verändert' }
          "Blockierte Deinstallation: abgebrochen, nichts entfernt (Exit $($b.ExitCode))."
          $u = Start-Process "$dir\unins000.exe" -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART') -PassThru -Wait
          for ($i = 0; $i -lt 120 -and (Test-Path "$dir\ECU-Studio-AI.exe"); $i++) { Start-Sleep -Milliseconds 500 }
          for ($i = 0; $i -lt 60 -and (Get-Process -Name '_iu*' -ErrorAction SilentlyContinue); $i++) { Start-Sleep -Milliseconds 500 }
          Start-Sleep -Seconds 2
          $left = @(Get-ChildItem $dir -Recurse -File -Force -ErrorAction SilentlyContinue | ForEach-Object { $_.FullName.Substring($dir.Length + 1) })
          "Nach Deinstallation im Programmordner: $($left -join ', ')"
          if ($u.ExitCode -ne 0) { throw "Deinstallation: Exit $($u.ExitCode)" }
          if ($left.Count -ne 1 -or $left[0] -ne '_internal\release-test-user-file.txt') { throw "Deinstallation: unerwartete Dateien: $($left -join ', ')" }
          if (Get-ItemProperty $key -ErrorAction SilentlyContinue) { throw 'Eintrag in Apps & Features nicht entfernt' }
          # Unlocked, the uninstallation runs: the own file of the backup stays, unchanged, in <app>.backup.erhalten.
          $keptOwn = "$dir.backup.erhalten\_internal\release-test-backup-file.txt"
          $keptAll = @(Get-ChildItem "$dir.backup.erhalten" -Recurse -File -Force -ErrorAction SilentlyContinue)
          if ((Test-Path "$dir.backup") -or $keptAll.Count -ne 1 -or -not (Test-Path $keptOwn) -or (Get-FileHash $keptOwn).Hash -ne $ownHash) {
            throw "Eigene Datei der Sicherung nicht unverändert erhalten: $($keptAll.FullName -join ', ')" }
          "Installer-Test auf ${{ matrix.os }} bestanden (von $old)."

  publish-plan:
    # Dry run only (release-dry-run/**): how the tag WOULD be published, with read-only rights. Nothing is created.
    needs: [build, update-test]
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.build.outputs.tag }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          sparse-checkout: src/ecu_studio
      - uses: actions/download-artifact@v4
        with:
          name: package
          path: dist
      - name: Files, checksums, title, channel and notes as they would be published
        run: PYTHONPATH=src python3 -m ecu_studio.tools.release_guard assets dist "$TAG" --summary "$GITHUB_STEP_SUMMARY"
      - name: Publishing plan against the live release list (read-only)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          export PYTHONPATH=src
          python3 -m ecu_studio.tools.release_guard selftest
          gh release list --repo "$REPO" --json tagName,isPrerelease,isDraft --limit 200 > releases.json
          latest="$(gh api "repos/$REPO/releases/latest" --jq .tag_name 2>/dev/null || true)"
          python3 -m ecu_studio.tools.release_guard plan "$TAG" --releases releases.json --latest "$latest" --out plan.json
          channel="${{ needs.build.outputs.channel }}"
          test "$(python3 -c "import json; print(json.load(open('plan.json'))['prerelease'])")" = "$([ "$channel" = prerelease ] && echo True || echo False)"
          flags="$(python3 -c "import json; print(' '.join(json.load(open('plan.json'))['flags']))")"
          draft_flag="$([ "$channel" = prerelease ] && echo '--prerelease' || true)"
          {
            echo "### Veröffentlichung von $TAG (nur geplant, nichts erstellt)"
            echo
            echo "- Kanal: \`$channel\`, aktuelles Latest: \`${latest:-keins}\` (bleibt bei einem RC unverändert)"
            echo "- 1. \`gh release create $TAG --verify-tag --draft $draft_flag --title \"$(cat dist/release-title.txt)\" ...\`"
            echo "- 2. Entwurf prüfen (Pre-Release-Kennzeichnung, Titel, Latest unverändert)"
            echo "- 3. \`gh release edit $TAG --draft=false $flags\`"
            echo "- 4. Prüfen: Kennzeichnung, Latest, alle anderen Releases und ihre Dateien unverändert"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Dry run: $TAG würde mit '$flags' veröffentlicht (Latest vorher: ${latest:-keins})."

  publish:
    needs: [build, update-test]
    # Only a pushed tag publishes; a dry-run branch stops at publish-plan.
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write        # create the GitHub release
      id-token: write        # build provenance attestation
      attestations: write
    env:
      TAG: ${{ needs.build.outputs.tag }}
      REPO: ${{ github.repository }}
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          sparse-checkout: src/ecu_studio
      - uses: actions/download-artifact@v4
        with:
          name: package
          path: dist
      - name: Check assets, checksums, title, channel and notes before publishing
        run: |
          set -euo pipefail
          test "$TAG" = "${{ github.ref_name }}"
          python3 -m ecu_studio.tools.release_guard assets dist "$TAG" --summary "$GITHUB_STEP_SUMMARY"
          test "$(cat dist/release-channel.txt)" = "${{ needs.build.outputs.channel }}"
      - name: Plan (stable or pre-release) and snapshot of all other releases
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # A re-pushed tag (e.g. after a history clean-up) must not replace published downloads.
          if gh release view "$TAG" --repo "$REPO" > /dev/null 2>&1; then
            echo "::notice::Release $TAG existiert bereits – Dateien bleiben unverändert."
            echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          gh release list --repo "$REPO" --json tagName,isPrerelease,isDraft --limit 200 > releases.json
          latest="$(gh api "repos/$REPO/releases/latest" --jq .tag_name 2>/dev/null || true)"
          python3 -m ecu_studio.tools.release_guard plan "$TAG" --releases releases.json --latest "$latest" --out plan.json
          gh api --paginate "repos/$REPO/releases?per_page=100" |
            jq -S -s --arg t "$TAG" 'add | map(select(.tag_name != $t) | {tag: .tag_name, prerelease, draft, name, assets: [.assets[] | {name, size, digest, updated_at}]}) | sort_by(.tag)' > others-before.json
          echo "skip=false" >> "$GITHUB_OUTPUT"
      - name: Build provenance (verifiable with "gh attestation verify")
        if: steps.plan.outputs.skip != 'true'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/ECU-Studio-AI-*-windows-x64.zip
            dist/ECU-Studio-AI-*-setup.exe
      - name: Publish GitHub release (draft first, then stable or pre-release as planned)
        if: steps.plan.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          prerelease="$(python3 -c "import json; print(json.load(open('plan.json'))['prerelease'])")"
          mapfile -t flags < <(python3 -c "import json; print('\n'.join(json.load(open('plan.json'))['flags']))")
          draft_flags=(--draft)
          if [ "$prerelease" = True ]; then draft_flags+=(--prerelease); fi
          files=("dist/ECU-Studio-AI-$version-windows-x64.zip" "dist/ECU-Studio-AI-$version-windows-x64.zip.sha256"
                 "dist/ECU-Studio-AI-$version-setup.exe" "dist/ECU-Studio-AI-$version-setup.exe.sha256")
          for sig in dist/ECU-Studio-AI-*.sig; do if [ -f "$sig" ]; then files+=("$sig"); fi; done
          gh release create "$TAG" --repo "$REPO" --verify-tag "${draft_flags[@]}" --title "$(cat dist/release-title.txt)" --notes-file dist/release-notes.md "${files[@]}"
          latest_before="$(python3 -c "import json; print(json.load(open('plan.json'))['latest_before'])")"
          gh release view "$TAG" --repo "$REPO" --json tagName,isPrerelease,isDraft,name > view.json
          latest="$(gh api "repos/$REPO/releases/latest" --jq .tag_name 2>/dev/null || true)"
          python3 -m ecu_studio.tools.release_guard verify --plan plan.json --release view.json --latest-after "$latest" --stage draft
          gh release edit "$TAG" --repo "$REPO" --draft=false "${flags[@]}"
      - name: Verify the published release
        if: steps.plan.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          gh release view "$TAG" --repo "$REPO" --json tagName,isPrerelease,isDraft,name > view.json
          latest="$(gh api "repos/$REPO/releases/latest" --jq .tag_name 2>/dev/null || true)"
          python3 -m ecu_studio.tools.release_guard verify --plan plan.json --release view.json --latest-after "$latest"
          test "$(gh release view "$TAG" --repo "$REPO" --json name --jq .name)" = "$(cat dist/release-title.txt)"
          gh release view "$TAG" --repo "$REPO" --json body --jq .body | grep -q '^## English'
          # No other release, its flags or its files changed (a candidate never touches the stable releases).
          gh api --paginate "repos/$REPO/releases?per_page=100" |
            jq -S -s --arg t "$TAG" 'add | map(select(.tag_name != $t) | {tag: .tag_name, prerelease, draft, name, assets: [.assets[] | {name, size, digest, updated_at}]}) | sort_by(.tag)' > others-after.json
          diff others-before.json others-after.json
          for f in "ECU-Studio-AI-$version-windows-x64.zip" "ECU-Studio-AI-$version-setup.exe"; do
            gh attestation verify "dist/$f" --repo "$REPO"
          done
          echo "Release $TAG: Titel, Kennzeichnung ($(cat dist/release-channel.txt)), Latest, Release-Text (DE + EN), Dateien, Herkunftsnachweise und alle anderen Releases geprüft."
