name: Installer QA (release candidate)

# Install, start, update and uninstall test of a release candidate on fresh GitHub-hosted Windows runners.
# Only for qa/** branches. It never creates a tag or a release and has read-only repository access;
# the packages stay workflow artifacts (7 days). The version number is the one in the source.
# InApp: the published old version updates itself from its own menu; the release source is a staging server on
# the runner (hosts file + throw-away test CA, removed afterwards). Nothing is published.
on:
  push:
    branches: ['qa/**']

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        id: py
        with:
          python-version: '3.13'
          architecture: x64
      - name: Package metadata for the release tools (as in release.yml)
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-deps -e .
      - name: Build, test and package with the official script
        shell: pwsh
        run: ./build_release.ps1 -Python313 "${{ steps.py.outputs.python-path }}"
      - name: Windows installer (Inno Setup 6), unchanged version
        shell: pwsh
        run: |
          $version = (Get-Content dist\ECU-Studio-AI\VERSION.txt).Trim()
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc /Qp "/DAppVersion=$version" packaging\installer.iss
          if ($LASTEXITCODE -ne 0) { throw 'Installer-Build fehlgeschlagen' }
          python -m ecu_studio.tools.withdrawn "dist\ECU-Studio-AI-$version-setup-manifest.txt"
          if ($LASTEXITCODE -ne 0) { throw 'Installer enthält zurückgezogene Lerndaten.' }
          # Same check as release.yml: tag == package version and a CHANGELOG section for it.
          python -m ecu_studio.tools.release_notes "v$version" --out dist\release-notes.md
          if ($LASTEXITCODE -ne 0) { throw 'Release-Notes/Version passen nicht.' }
          Copy-Item dist\ECU-Studio-AI\VERSION.txt dist\VERSION.txt
          foreach ($f in Get-ChildItem dist\ECU-Studio-AI-*-windows-x64.zip, dist\ECU-Studio-AI-*-setup.exe) {
            (Get-FileHash $f.FullName -Algorithm SHA256).Hash.ToLower() + "  " + $f.Name | Set-Content -Encoding ascii "$($f.FullName).sha256"
          }
      - uses: actions/upload-artifact@v4
        with:
          name: rc-package
          path: |
            dist/ECU-Studio-AI-*-windows-x64.zip
            dist/ECU-Studio-AI-*-setup.exe
            dist/ECU-Studio-AI-*.sha256
            dist/ECU-Studio-AI-*-setup-manifest.txt
            dist/VERSION.txt
            dist/release-notes.md
          retention-days: 7

  installer:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
        mode: [Fresh, Update, InApp]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          sparse-checkout: .github/qa
      - uses: actions/setup-python@v6
        id: qapy
        with:
          python-version: '3.13'
      - name: Test tools (runner only, not part of the package)
        shell: pwsh
        run: python -m pip install --disable-pip-version-check cryptography pywinauto pillow
      - uses: actions/download-artifact@v4
        with:
          name: rc-package
          path: rc
      - name: ${{ matrix.mode }} test
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./.github/qa/installer_test.ps1 -Mode ${{ matrix.mode }} -Package rc -Out "$env:RUNNER_TEMP\qa" -Repository "${{ github.repository }}" -QaPython "${{ steps.qapy.outputs.python-path }}"
      - name: Collect results
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory qa-out -Force | Out-Null
          Copy-Item "$env:RUNNER_TEMP\qa\results.json", "$env:RUNNER_TEMP\qa\*.png", "$env:RUNNER_TEMP\qa\*.log", "$env:RUNNER_TEMP\qa\python-*", "$env:RUNNER_TEMP\qa\*.out", "$env:RUNNER_TEMP\qa\*.err", "$env:RUNNER_TEMP\qa\staging\requests.log", "$env:RUNNER_TEMP\qa\*.txt" qa-out -ErrorAction SilentlyContinue
          Get-ChildItem "$env:RUNNER_TEMP\qa" -Recurse -Include *.json, *.png -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -notmatch '\\old\\' } | ForEach-Object {
              $name = $_.FullName.Substring("$env:RUNNER_TEMP\qa\".Length).Replace('\', '__')
              Copy-Item $_.FullName (Join-Path qa-out $name) }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installer-qa-${{ matrix.os }}-${{ matrix.mode }}
          path: qa-out
          retention-days: 14
