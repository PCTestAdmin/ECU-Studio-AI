[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ecu-studio-ai"
version = "1.17.0"
description = "ECU calibration workbench: map detection without definitions, XDF/A2L import, heatmap and 3D views"
license = {text = "GPL-3.0-only"}
readme = "README.md"
keywords = ["ecu", "calibration", "map editor", "xdf", "a2l", "tunerpro", "reverse engineering"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: Microsoft :: Windows",
    "Environment :: X11 Applications :: Qt",
    "Topic :: Scientific/Engineering",
]
requires-python = ">=3.10"
dependencies = ["PySide6>=6.6,<7", "numpy>=1.24,<3", "defusedxml>=0.7.1,<1"]

[project.urls]
Homepage = "https://github.com/PCTestAdmin/ECU-Studio-AI"
Issues = "https://github.com/PCTestAdmin/ECU-Studio-AI/issues"
Changelog = "https://github.com/PCTestAdmin/ECU-Studio-AI/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=8", "psutil>=5.9"]
train = ["scikit-learn>=1.6,<2"]

[project.scripts]
ecu-studio = "ecu_studio.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.package-data]
"ecu_studio.recognition" = ["data/*", "data/definitions/*", "data/i18n/*", "data/training/*", "data/training/sources/*"]
